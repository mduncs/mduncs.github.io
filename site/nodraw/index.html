<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      // Theme: follows the system setting until the visitor flips it. Flipping back to the system's theme follows the system again.
      (() => {
        const icons = {
          light: '<circle cx="8" cy="8" r="2.75" fill="currentColor"/><path d="M8 1.5v1.25M8 13.25v1.25M1.5 8h1.25M13.25 8h1.25M3.4 3.4l.9.9M11.7 11.7l.9.9M3.4 12.6l.9-.9M11.7 4.3l.9-.9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>',
          dark: '<path d="M13.25 9.9A5.75 5.75 0 0 1 6.1 2.75a5.75 5.75 0 1 0 7.15 7.15z" fill="currentColor"/>'
        };
        const root = document.documentElement;
        const system = matchMedia('(prefers-color-scheme: dark)');
        const systemTheme = () => (system.matches ? 'dark' : 'light');
        const stored = () => {
          try { const t = localStorage.getItem('md-theme'); return t === 'light' || t === 'dark' ? t : null; } catch { return null; }
        };
        let choice = stored(), button = null;

        function apply() {
          const theme = choice || systemTheme();
          root.dataset.theme = theme;
          if (!button) return;
          const next = theme === 'dark' ? 'light' : 'dark';
          button.innerHTML = `<svg viewBox="0 0 16 16" aria-hidden="true">${icons[next]}</svg>`;
          button.title = `Switch to ${next} mode`;
          button.setAttribute('aria-label', button.title);
        }

        apply();
        system.addEventListener('change', apply);
        addEventListener('storage', () => { choice = stored(); apply(); });
        addEventListener('DOMContentLoaded', () => {
          // A page can place its own .theme-toggle; otherwise it goes in the corner.
          button = document.querySelector('.theme-toggle')
            || document.body.appendChild(Object.assign(document.createElement('button'), { type: 'button', className: 'theme-toggle' }));
          button.addEventListener('click', () => {
            const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
            choice = next === systemTheme() ? null : next;
            try { choice ? localStorage.setItem('md-theme', choice) : localStorage.removeItem('md-theme'); } catch {}
            apply();
          });
          apply();
        });
      })();
    </script>
    <title>NoDraw — a personal media archive for macOS</title>
    <meta
      name="description"
      content="NoDraw is a personal media archive for macOS."
    >
    <meta property="og:title" content="NoDraw">
    <meta property="og:description" content="Keep what you save. A personal media archive for macOS.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="assets/nodraw-showcase.jpg">
    <link rel="icon" href="assets/favicon.png">
    <link rel="stylesheet" href="styles.css">
    <style>
      /* Light is the paper default from styles.css; dark is the same sheet in warm ink. */
      :root {
        --toggle: var(--muted);
        --toggle-hover: var(--ink);
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --paper: #12110e;
        --ink: #ece7dc;
        --muted: #9b968b;
        --line: rgba(236, 231, 220, 0.2);
        --orange: #ec8e1c;
      }

      [data-theme="dark"] body {
        background-image:
          linear-gradient(rgba(236, 231, 220, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(236, 231, 220, 0.035) 1px, transparent 1px);
      }

      [data-theme="dark"] .product {
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5);
      }

      [data-theme="dark"] .download strong {
        color: #b86400;
      }

      [data-theme="dark"] .download:hover,
      [data-theme="dark"] .download:hover strong {
        color: var(--paper);
      }

      /* theme toggle: a quiet icon button pinned to the top-right corner */
      .theme-toggle {
        position: fixed;
        top: 6px;
        right: 6px;
        z-index: 100;
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: none;
        color: var(--toggle);
        cursor: pointer;
        transition: color 0.15s;
        -webkit-tap-highlight-color: transparent;
      }

      .theme-toggle:hover,
      .theme-toggle:focus-visible { color: var(--toggle-hover); }
      .theme-toggle:focus-visible { outline: 2px solid currentColor; outline-offset: 1px; }
      .theme-toggle svg { display: block; width: 16px; height: 16px; }
    </style>
  </head>
  <body>
    <main class="sheet">
      <header class="masthead">
        <a class="brand" href="./" aria-label="NoDraw home">
          <img src="assets/nodraw-icon.png" alt="">
          <span>nodraw</span>
        </a>

        <ul class="feature-rail" aria-label="Core features">
          <li>ordinary files</li>
          <li>markdown sidecars</li>
          <li>source attached</li>
          <li>search + OCR</li>
          <li>tagging</li>
        </ul>
      </header>

      <!-- Demo slot: the software-demo-automation stage script replaces the
           poster and source values below. -->
      <figure class="product" aria-label="NoDraw product demo">
        <video
          autoplay
          controls
          loop
          muted
          playsinline
          preload="metadata"
          poster="demos/2026-10-05-v1/nodraw-poster-b2fd8d960888.jpg"
        >
          <source src="demos/2026-10-05-v1/nodraw-demo-253e1909b55e.mp4" type="video/mp4">
        </video>
        <div class="pending">demo in production</div>
      </figure>

      <footer class="closing">
        <div class="statement">
          <h1>Keep what you save.</h1>
        </div>

        <nav class="actions" aria-label="NoDraw links">
          <a
            class="source-link"
            href="https://github.com/mduncs/nodraw-app"
            aria-label="View the NoDraw repository on GitHub"
          >View Source</a>
          <a
            class="download"
            href="https://github.com/mduncs/nodraw-app/releases"
            aria-label="Download NoDraw from GitHub Releases"
          >
            <span>Download for Mac</span>
            <strong>↓</strong>
          </a>
        </nav>
      </footer>
    </main>
    <script>
      const product = document.querySelector('.product');
      const source = product.querySelector('video source');
      if (/\/demos\/pending\//.test(source.src)) product.classList.add('is-pending');
    </script>
  </body>
</html>
