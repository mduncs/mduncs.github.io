<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NoDraw — a personal media archive for macOS</title>
    <meta
      name="description"
      content="NoDraw is a personal media archive for macOS."
    >
    <meta property="og:title" content="NoDraw">
    <meta property="og:description" content="Keep what you save. A personal media archive for macOS.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="assets/nodraw-showcase.jpg">
    <link rel="icon" href="assets/favicon.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="sheet">
      <header class="masthead">
        <a class="brand" href="./" aria-label="NoDraw home">
          <img src="assets/nodraw-icon.png" alt="">
          <span>nodraw</span>
        </a>

        <ul class="feature-rail" aria-label="Core features">
          <li>ordinary files</li>
          <li>markdown sidecars</li>
          <li>source attached</li>
          <li>search + OCR</li>
          <li>grid + table</li>
        </ul>
      </header>

      <figure class="product" aria-label="NoDraw product demo">
        <video
          autoplay
          controls
          loop
          muted
          playsinline
          preload="metadata"
          poster="assets/nodraw-showcase.jpg"
        >
          <source src="nodraw-demo.mp4" type="video/mp4">
        </video>
      </figure>

      <footer class="closing">
        <div class="statement">
          <h1>Keep what you save.</h1>
        </div>

        <nav class="actions" aria-label="NoDraw links">
          <a
            class="source-link"
            href="https://github.com/mduncs/nodraw-app"
            aria-label="View the NoDraw repository on GitHub"
          >View Source</a>
          <a
            class="download"
            href="https://github.com/mduncs/nodraw-app/releases"
            aria-label="Download NoDraw from GitHub Releases"
          >
            <span>Download for Mac</span>
            <strong>↓</strong>
          </a>
        </nav>
      </footer>
    </main>
  </body>
</html>
